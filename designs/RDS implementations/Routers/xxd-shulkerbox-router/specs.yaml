---
specsheet_filename: "specs.md"
device_class: rds-router
name: "xxd Shulker Box Router"
brief_doc: "A compact and ultrafast design for Shulker Box Packages. Part of the xxd-rds-suite"
icon_filename: imgs/render1.png

# map multiple versions of this design to branches or commits of the repo. You usually want to have the latest version
# pointing to the master branch, and fix older versions to specific commits.
# NOTE: This map must be updated manually when a new version is published.
versions:
  "1.0": master

minecraft:
  # TODO bedrock versioning is different
  edition: "Java" # or "Bedrock" or "Any" (for both editions)
  lower: "1.21.0" # works from this version ...

directional: true
locational: false
works_in_nether: true
survival_friendliness: low # or "moderate" or "low"

package_tech: ShulkerBox 
protocol: standard-rds
supports_hierarchical_routing: false # see hierarchical_routing.md

# ---- In the fields below, letters such as N, M can be defined in the physical/logical
# ports sections, and used in the expressions below. This allows support for infinitely tilable designs.

# From how many physical "connections" the router can receive/send packages
physical_ports:
  input: 5
  output: 5

# How many logical connections the router has (If the router cannot do source-port based routing, 1 logical input and same outputs as above)
logical_ports:
  input: 1
  output: 5

footprint:
  length: 16
  width: 16
  height: 14

chunkloading_included: true
package_queue_included: true
package_queue_size: 54
throughput: 10 # packages per minute


