<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDS Device Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="mb-5">
        <h1 class="display-5 fw-bold mb-2">RDS Device Browser</h1>
        <p class="text-muted">Search and filter MIWF devices for your Minecraft world</p>
    </div>

    <!-- Filter Card -->
    <div class="card shadow-sm mb-5 border-0">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0">
                <i class="bi bi-funnel"></i> Filter Devices
            </h5>
        </div>
        <div class="card-body p-3">
            <form id="filter-form">
                <div class="mb-3">
                    <h6 class="text-uppercase fw-bold text-muted mb-2" style="font-size: 0.75rem; letter-spacing: 0.5px;">Device Class</h6>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <div class="mb-2">
                                <small class="text-muted">Choose the device type first, then refine the filters below.</small>
                            </div>
                            <select id="device-class-select" name="device_class" class="form-select form-select-sm">
                                <option value="rds-router" selected>RDS Router</option>
                                <option value="rds-terminal">RDS Terminal</option>
                                <option value="rds-link">RDS Link</option>
                                <option value="rds-package">RDS Package</option>
                                <option value="rds-adapter">RDS Adapter</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="border-top pt-3 mt-3">
                    {% include "partials/device_filter_panels.html" %}
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2 pt-2 border-top mt-3">
                    <button type="reset" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Reset
                    </button>
                    <button type="submit" class="btn btn-sm btn-primary ms-auto">
                        <i class="bi bi-search"></i> Apply
                    </button>
                </div>

            </form>
        </div>
        <style>
            .col-lg-1-5 { flex: 0 0 calc(16.666667% * 1.2); max-width: calc(16.666667% * 1.2); }
        </style>
    </div>

    <!-- Results Section -->
    <div class="mb-4">
        <h5 class="mb-2">Results</h5>
        <div id="results-content">
            {% include "partials/device_results.html" %}
        </div>
    </div>
</div>

<script id="versions-java-data" type="application/json">{{ versions_java | tojson }}</script>
<script id="versions-bedrock-data" type="application/json">{{ versions_bedrock | tojson }}</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/device-browser.js"></script>
</body>
</html>
